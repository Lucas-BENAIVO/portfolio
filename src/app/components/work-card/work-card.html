<article
  [class]="
    'work-card work-card--' +
    (colorIndex() % 4) +
    (image() ? ' work-card--has-media' : '') +
    (compact() ? ' work-card--compact' : '')
  "
  appReveal
  [appRevealDelay]="revealDelay()"
>
  @if (image()) {
    <div class="work-card__media">
      <img [src]="image()!" [alt]="title()" loading="lazy" decoding="async" />
    </div>
  }

  <div class="work-card__content">
    <span class="work-card__title">{{ title() }}</span>
    <span class="work-card__meta">{{ meta() }}</span>
    @if (description()) {
      <p class="work-card__desc">{{ description() }}</p>
    }

    <div class="work-card__actions">
      @if (viewHref()) {
        <a
          class="work-card__action"
          [href]="viewHref()!"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="ui().viewProject"
          [attr.data-tooltip]="ui().tooltipSite"
        >
          <svg class="work-card__action-icon work-card__action-icon--view" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7" />
            <path d="M7 7h10v10" />
          </svg>
        </a>
      }

      @if (detailsRouterLink()) {
        <a
          class="work-card__action"
          [routerLink]="detailsRouterLink()!"
          [attr.aria-label]="ui().viewDetails"
          [attr.data-tooltip]="ui().tooltipDetails"
        >
          <svg class="work-card__action-icon work-card__action-icon--details" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16" />
            <path d="M4 12h16" />
            <path d="M4 18h10" />
          </svg>
        </a>
      }

      @if (showCode) {
        @if (codeReady) {
          <a
            class="work-card__action"
            [href]="githubUrl()!"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="ui().viewCode"
            [attr.data-tooltip]="ui().tooltipCode"
          >
            <svg class="work-card__action-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
            </svg>
          </a>
        } @else {
          <span
            class="work-card__action work-card__action--pending"
            [attr.aria-label]="ui().githubPending"
            [attr.data-tooltip]="ui().tooltipCode"
          >
            <svg class="work-card__action-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
            </svg>
          </span>
        }
      }
    </div>
  </div>
</article>

<section class="home">
  <header class="home__top">
    @if (portfolio.openToWork) {
      <span class="badge-open">Open to work</span>
    }
    <a
      class="btn-cv"
      [href]="portfolio.cvUrl"
      [attr.download]="portfolio.cvDownloadName"
      type="application/pdf"
    >
      <span class="btn-cv__icon" aria-hidden="true"></span>
      <span class="btn-cv__label">Download CV</span>
    </a>
  </header>

  <div class="home__body">
    <div class="home__content">
      <p class="home__role">{{ portfolio.role }}</p>
      <h1 class="home__name">{{ portfolio.name }}</h1>

      <div class="home__contacts">
        @for (contact of portfolio.contacts; track contact.label) {
          @if (contact.whatsappHref) {
            <div class="contact-item" [attr.data-icon]="contact.icon">
              <span class="contact-item__icon" aria-hidden="true"></span>
              <span class="contact-item__text">
                <span class="contact-item__label">{{ contact.label }}</span>
                <span class="contact-item__value contact-item__value--phone">
                  <a class="contact-item__link" [href]="contact.href">{{ contact.value }}</a>
                  <a
                    class="contact-item__wa"
                    [href]="contact.whatsappHref"
                    target="_blank"
                    rel="noopener noreferrer"
                    [attr.aria-label]="'WhatsApp — ' + contact.value"
                  >
                    <span class="contact-item__wa-icon" aria-hidden="true"></span>
                  </a>
                </span>
              </span>
            </div>
          } @else {
            <a class="contact-item" [href]="contact.href" [attr.data-icon]="contact.icon">
              <span class="contact-item__icon" aria-hidden="true"></span>
              <span class="contact-item__text">
                <span class="contact-item__label">{{ contact.label }}</span>
                <span class="contact-item__value">{{ contact.value }}</span>
              </span>
            </a>
          }
        }
      </div>
    </div>

    <div class="home__visual" aria-hidden="true">
      <img
        class="home__profile"
        src="/profile.png"
        [alt]="'Photo de ' + portfolio.name"
        width="1734"
        height="907"
        decoding="async"
        fetchpriority="high"
      />
    </div>
  </div>
</section>
